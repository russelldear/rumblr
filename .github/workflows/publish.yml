name: Scrape & publish

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "eleventy.config.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/publish.yml"

# Allow the job to commit scraped content and deploy to Pages.
permissions:
  contents: write
  pages: write
  id-token: write

# Never run two publishes at once; let a running one finish.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Sync from Tumblr API
        id: scrape
        run: npm run scrape
        env:
          TUMBLR_API_KEY: ${{ secrets.TUMBLR_API_KEY }}

      - name: Commit new content
        run: |
          git config user.name "rumblr-bot"
          git config user.email "rumblr-bot@users.noreply.github.com"
          git add data/posts media data/poll-state.json
          if git diff --cached --quiet; then
            echo "No new content."
          else
            git commit -m "content: sync feed ($(date -u +%Y-%m-%dT%H:%MZ))"
            git push origin HEAD:${{ github.event.repository.default_branch }}
            echo "GITHUB_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          fi

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build site
        run: npm run build
        env:
          PATH_PREFIX: ${{ steps.pages.outputs.base_path }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to Pages
        id: deploy
        uses: actions/deploy-pages@v4

      # A single failed poll is noise. The scrape step raises this only after a
      # sustained outage, or when the blog gained posts we did not capture.
      # Last, so the site still deploys before the run is marked failed.
      - name: Flag sustained retrieval failure
        if: always() && steps.scrape.outputs.should_alert == 'true'
        env:
          REASON: ${{ steps.scrape.outputs.alert_reason }}
        run: |
          echo "::error::$REASON"
          exit 1
