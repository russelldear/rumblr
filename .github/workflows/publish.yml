name: Scrape & publish

on:
  schedule:
    # Every 5 minutes: GitHub's floor for scheduled workflows. The Tumblr API
    # is nowhere near its limit at this rate (one call per poll against a
    # documented 300/minute per IP); GitHub is the binding constraint, not the
    # key. Actual firing is best-effort: the schedule event is delayed under
    # load, especially at the top of the hour.
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "eleventy.config.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/publish.yml"

# Never run two publishes at once; let a running one finish.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  # Sync and build carry no `environment`, so this job runs on any branch.
  # Deployment lives in a separate job below because the github-pages
  # environment is restricted to the default branch, and a job-level
  # environment blocks the whole job, not just the deploy step.
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # configure-pages reads the Pages site config to derive the path prefix.
      pages: read
    outputs:
      should_alert: ${{ steps.scrape.outputs.should_alert }}
      alert_reason: ${{ steps.scrape.outputs.alert_reason }}
      is_default: ${{ steps.branch.outputs.is_default }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Sync from Tumblr API
        id: scrape
        run: npm run scrape
        env:
          TUMBLR_API_KEY: ${{ secrets.TUMBLR_API_KEY }}

      # Only the default branch owns the site's content. A run on a feature
      # branch would otherwise push that branch's HEAD to the default branch,
      # merging it without review.
      - name: Check branch
        id: branch
        run: |
          if [ "$GITHUB_REF_NAME" = "$DEFAULT_BRANCH" ]; then
            echo "is_default=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_default=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Running on $GITHUB_REF_NAME, not $DEFAULT_BRANCH: content will not be committed and the site will not be deployed."
          fi
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

      - name: Commit new content
        if: steps.branch.outputs.is_default == 'true'
        run: |
          git config user.name "rumblr-bot"
          git config user.email "rumblr-bot@users.noreply.github.com"
          git add data/posts media data/poll-state.json
          if git diff --cached --quiet; then
            echo "No new content."
          else
            git commit -m "content: sync feed ($(date -u +%Y-%m-%dT%H:%MZ))"
            git push origin HEAD:${{ github.event.repository.default_branch }}
          fi

      - name: Report uncommitted content
        if: steps.branch.outputs.is_default != 'true'
        run: |
          git add --intent-to-add data/posts media data/poll-state.json
          git status --short data/posts media data/poll-state.json

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build site
        run: npm run build
        env:
          PATH_PREFIX: ${{ steps.pages.outputs.base_path }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: sync
    if: needs.sync.outputs.is_default == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to Pages
        id: deploy
        uses: actions/deploy-pages@v4

  # Last, and needs the deploy, so the site is published before the run is
  # marked failed. A single failed poll is noise: the sync step raises this
  # only after a sustained outage, or when the blog gained posts we did not
  # capture.
  alert:
    needs: [sync, deploy]
    if: always() && needs.sync.outputs.should_alert == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Flag sustained retrieval failure
        env:
          REASON: ${{ needs.sync.outputs.alert_reason }}
        run: |
          echo "::error::$REASON"
          exit 1
