name: Keepalive

# GitHub disables scheduled workflows after 60 days with no repo activity.
# The publish job commits whenever the feed changes, but if the feed goes
# quiet for two months this nudge keeps the schedule alive.

on:
  schedule:
    - cron: "17 4 1 * *" # 04:17 UTC on the 1st of each month
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name "rumblr-bot"
          git config user.email "rumblr-bot@users.noreply.github.com"
          date -u +%Y-%m-%dT%H:%MZ > .keepalive
          git add .keepalive
          git commit -m "chore: keepalive" || exit 0
          git push
